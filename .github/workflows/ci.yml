name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  resource:
    name: Resource validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Validate Lua syntax
        run: |
          find client config server shared -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Validate locale JSON
        run: |
          python3 -m json.tool locales/en.json >/dev/null
          python3 -m json.tool locales/es.json >/dev/null

  nui:
    name: NUI build, lint and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Assemble clean FiveM package
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          root="package/armasvip"
          mkdir -p "$root/web"
          cp fxmanifest.lua LICENSE "$root/"
          cp -R client config locales server shared sql "$root/"
          cp -R web/dist "$root/web/dist"

          if find "$root" -type f \( -name '*.md' -o -name '*.ts' -o -name '*.tsx' -o -name '*.tsbuildinfo' -o -name 'package.json' -o -name 'package-lock.json' \) | grep -q .; then
            echo 'Unexpected development file found in runtime package.' >&2
            find "$root" -type f | sort
            exit 1
          fi

          (cd package && zip -qr ../ArmasVIP-2.4.0-rc.zip armasvip)
          echo 'Installable package contents:'
          find "$root" -type f | sort
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: ArmasVIP-2.4.0-rc
          path: ArmasVIP-2.4.0-rc.zip
          if-no-files-found: error
          retention-days: 14

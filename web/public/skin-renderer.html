<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ArmasVIP Skin Renderer</title>
  <style>
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="skin" width="512" height="512"></canvas>
<script>
(() => {
  const canvas = document.getElementById('skin');
  const ctx = canvas.getContext('2d', { alpha: false });
  const preset = new URLSearchParams(location.search).get('preset') || 'carbon';
  const size = canvas.width;
  const rand = (seed) => {
    const x = Math.sin(seed * 999.91) * 43758.5453;
    return x - Math.floor(x);
  };

  function background(a, b) {
    const g = ctx.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  }

  function carbon() {
    background('#111418', '#242a31');
    const tile = 26;
    for (let y = -tile; y < size + tile; y += tile) for (let x = -tile; x < size + tile; x += tile) {
      const even = ((x / tile + y / tile) & 1) === 0;
      ctx.fillStyle = even ? 'rgba(255,255,255,.055)' : 'rgba(0,0,0,.22)';
      ctx.beginPath();
      ctx.moveTo(x, y + tile / 2); ctx.lineTo(x + tile / 2, y); ctx.lineTo(x + tile, y + tile / 2); ctx.lineTo(x + tile / 2, y + tile); ctx.closePath(); ctx.fill();
    }
    const shine = ctx.createLinearGradient(0, size, size, 0);
    shine.addColorStop(.2, 'rgba(255,255,255,0)'); shine.addColorStop(.5, 'rgba(255,255,255,.13)'); shine.addColorStop(.8, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine; ctx.fillRect(0, 0, size, size);
  }

  function gold() {
    background('#4d2800', '#f6bf35');
    const g = ctx.createRadialGradient(size * .34, size * .25, 10, size * .4, size * .4, size * .75);
    g.addColorStop(0, '#fff3a0'); g.addColorStop(.22, '#e8ad24'); g.addColorStop(.62, '#8a4c08'); g.addColorStop(1, '#291204');
    ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    ctx.globalAlpha = .16;
    for (let i = 0; i < 90; i++) { const y = rand(i + 3) * size; ctx.fillStyle = i % 3 ? '#fff' : '#3c1f02'; ctx.fillRect(0, y, size, 1 + rand(i + 5) * 2); }
    ctx.globalAlpha = 1;
  }

  function obsidian() {
    background('#020204', '#17131e');
    for (let i = 0; i < 70; i++) {
      const x = rand(i * 5) * size, y = rand(i * 9) * size, r = 20 + rand(i * 11) * 80;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, i % 3 ? 'rgba(125,55,190,.25)' : 'rgba(255,255,255,.08)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(x-r, y-r, r*2, r*2);
    }
  }

  function arctic() {
    background('#d9f7ff', '#5aa9d6');
    ctx.strokeStyle = 'rgba(255,255,255,.72)'; ctx.lineWidth = 3;
    for (let i = 0; i < 34; i++) {
      const x = rand(i*2) * size, y = rand(i*3) * size;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 70 + rand(i)*120, y - 30 - rand(i+1)*80); ctx.stroke();
    }
    ctx.globalAlpha = .18; ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 100; i++) ctx.fillRect(rand(i*7)*size, rand(i*13)*size, 2, 2);
    ctx.globalAlpha = 1;
  }

  function crimson() {
    background('#190006', '#640016');
    ctx.strokeStyle = 'rgba(255,70,100,.55)'; ctx.lineWidth = 5;
    for (let i = 0; i < 18; i++) {
      ctx.beginPath();
      const y = i * 34 + rand(i)*18; ctx.moveTo(-20, y);
      for (let x = 0; x <= size + 40; x += 55) ctx.lineTo(x, y + Math.sin(x*.03+i)*20);
      ctx.stroke();
    }
  }

  function toxic() {
    background('#07140a', '#102d0f');
    for (let i = 0; i < 55; i++) {
      const x = rand(i*4)*size, y = rand(i*6)*size, r = 8 + rand(i*8)*40;
      const g = ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,'rgba(133,255,0,.65)'); g.addColorStop(1,'rgba(30,255,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
  }

  function galaxy(time) {
    const t = time * .00009; background('#03020d', '#10052b');
    const cx = size * (.45 + Math.sin(t * 2) * .08), cy = size * (.45 + Math.cos(t * 1.7) * .08);
    const nebula = ctx.createRadialGradient(cx, cy, 15, cx, cy, size * .7);
    nebula.addColorStop(0, 'rgba(255,74,210,.92)'); nebula.addColorStop(.2, 'rgba(93,80,255,.75)'); nebula.addColorStop(.48, 'rgba(15,196,255,.42)'); nebula.addColorStop(1, 'rgba(3,2,13,0)');
    ctx.fillStyle = nebula; ctx.fillRect(0, 0, size, size);
    for (let i = 0; i < 115; i++) {
      const x = (rand(i * 3 + 2) * size + time * (.005 + rand(i) * .012)) % size, y = rand(i * 7 + 8) * size, r = .5 + rand(i * 11) * 1.7;
      ctx.globalAlpha = .35 + rand(i * 13) * .65; ctx.fillStyle = i % 7 === 0 ? '#7fe8ff' : '#ffffff'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function inferno(time) {
    background('#160100', '#450800'); const t = time * .0028;
    for (let i = 0; i < 24; i++) {
      const baseX = (i / 24) * size, phase = i * .82 + t, height = 120 + (Math.sin(phase) + 1) * 75;
      const grad = ctx.createLinearGradient(0, size, 0, size - height);
      grad.addColorStop(0, '#ff2000'); grad.addColorStop(.35, '#ff7600'); grad.addColorStop(.7, '#ffd84a'); grad.addColorStop(1, 'rgba(255,238,126,0)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(baseX - 18, size); ctx.quadraticCurveTo(baseX + Math.sin(phase * 1.4) * 28, size - height * .55, baseX + Math.sin(phase) * 20, size - height); ctx.quadraticCurveTo(baseX + 24, size - height * .55, baseX + 22, size); ctx.closePath(); ctx.fill();
    }
  }

  function electric(time) {
    background('#020817', '#071b43'); const t = time * .002; ctx.lineCap = 'round';
    for (let bolt = 0; bolt < 7; bolt++) {
      const seed = bolt * 37, yBase = ((bolt + .5) / 7) * size + Math.sin(t + bolt) * 18;
      ctx.beginPath(); ctx.moveTo(-20, yBase);
      for (let s = 0; s <= 18; s++) { const x = (s / 18) * (size + 40) - 20; const y = yBase + Math.sin(s * 1.6 + t * 2 + bolt) * 22 + (rand(seed + s) - .5) * 28; ctx.lineTo(x, y); }
      ctx.shadowBlur = 18; ctx.shadowColor = '#16d9ff'; ctx.strokeStyle = bolt % 2 ? '#66ecff' : '#b8fbff'; ctx.lineWidth = 2 + (bolt % 3); ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  function aurora(time) {
    background('#03090d', '#0a1930'); const t = time * .0011;
    ctx.globalCompositeOperation = 'screen';
    for (let band = 0; band < 5; band++) {
      const hue = 145 + band * 35; ctx.strokeStyle = `hsla(${hue},95%,65%,.5)`; ctx.lineWidth = 34 - band*4; ctx.shadowBlur = 28; ctx.shadowColor = `hsl(${hue},95%,60%)`;
      ctx.beginPath();
      for (let x = -40; x <= size+40; x += 16) { const y = size*.2 + band*65 + Math.sin(x*.018 + t + band)*55; if (x === -40) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
      ctx.stroke();
    }
    ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-over';
  }

  function plasma(time) {
    const t = time * .0014; background('#090018', '#220039');
    for (let i = 0; i < 9; i++) {
      const x = size*(.5 + .38*Math.sin(t*(.7+i*.04)+i*1.7)); const y = size*(.5 + .38*Math.cos(t*(.9+i*.03)+i*1.2));
      const g = ctx.createRadialGradient(x,y,0,x,y,150); g.addColorStop(0, i%2 ? 'rgba(255,0,230,.55)' : 'rgba(0,220,255,.52)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,size,size);
    }
  }

  function matrix(time) {
    background('#001006', '#001b08'); const t = time*.08; ctx.font = '18px monospace'; ctx.textAlign='center';
    for (let col=0; col<28; col++) {
      const x = col*(size/28)+8; const offset = (t*(.55+rand(col)*.8)+rand(col*9)*size)% (size+140)-70;
      for (let row=0; row<16; row++) { const y = (offset + row*28)% (size+60)-30; ctx.fillStyle = row===15 ? '#d7ffd7' : `rgba(50,255,90,${.12 + row*.035})`; ctx.fillText(String.fromCharCode(0x30A0 + ((col*17+row*11)%80)),x,y); }
    }
  }

  function bloodmoon(time) {
    background('#120006', '#2b0010'); const t=time*.0006;
    const x=size*(.5+Math.sin(t)*.08), y=size*(.5+Math.cos(t*.8)*.06), r=size*.2;
    const moon=ctx.createRadialGradient(x-r*.3,y-r*.35,10,x,y,r); moon.addColorStop(0,'#ffb08c'); moon.addColorStop(.35,'#e64028'); moon.addColorStop(1,'#4a0010'); ctx.fillStyle=moon; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,40,40,.32)'; ctx.lineWidth=3;
    for(let i=0;i<18;i++){ctx.beginPath();const yy=(i*34 + time*.04)%size;ctx.moveTo(0,yy);ctx.bezierCurveTo(size*.25,yy-30,size*.75,yy+30,size,yy-10);ctx.stroke();}
  }

  const animatedPresets = new Set(['galaxy','inferno','electric','aurora','plasma','matrix','bloodmoon']);
  function render(time = 0) {
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    if (preset === 'gold') gold();
    else if (preset === 'obsidian') obsidian();
    else if (preset === 'arctic') arctic();
    else if (preset === 'crimson') crimson();
    else if (preset === 'toxic') toxic();
    else if (preset === 'galaxy') galaxy(time);
    else if (preset === 'inferno') inferno(time);
    else if (preset === 'electric') electric(time);
    else if (preset === 'aurora') aurora(time);
    else if (preset === 'plasma') plasma(time);
    else if (preset === 'matrix') matrix(time);
    else if (preset === 'bloodmoon') bloodmoon(time);
    else carbon();
    if (animatedPresets.has(preset)) requestAnimationFrame(render);
  }
  render();
})();
</script>
</body>
</html>
